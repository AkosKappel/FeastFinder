# https://nuxt.com/deploy/github-pages
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # Weekly rebuild so the meal index (public/data/meals.json) picks up new recipes.
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, but skip superseded queued runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate
        env:
          NITRO_PRESET: github_pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
